<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跳跳龙小游戏</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <h1>🐉 跳跳龙</h1>
      <p class="tips">按 <kbd>空格</kbd> / <kbd>↑</kbd> 跳跃，躲开火山石！</p>

      <section class="game" id="game" aria-label="跳跳龙游戏区域">
        <div class="score-board">
          <span>得分: <strong id="score">0</strong></span>
          <span>最高分: <strong id="best">0</strong></span>
        </div>

        <div class="dragon" id="dragon" role="img" aria-label="小龙">🐲</div>
        <div class="obstacle" id="obstacle" aria-hidden="true">🪨</div>

        <div class="overlay" id="overlay">
          <p id="overlayText">按“开始游戏”</p>
          <button id="startBtn" type="button">开始游戏</button>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
